{% extends "base.html" %}
{% block content %}
<style>
    .options-group { display: flex; gap: 15px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
    .radio-label { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; }
    input[type="radio"]:checked + .radio-label { background: var(--primary); }
    input[type="radio"] { display: none; }
    textarea { width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 20px; border-radius: 15px; font-family: inherit; font-size: 1rem; min-height: 150px; box-sizing: border-box; }
    .btn-main { width: 100%; background: linear-gradient(to right, var(--primary), #ec4899); border: none; padding: 16px; color: white; font-size: 1.2rem; font-weight: 700; border-radius: 12px; cursor: pointer; margin-top: 15px;}
    .result-section { display: none; margin-top: 30px; }
    #loadingIndicator { text-align: center; display: none; margin-top: 20px; color: #818cf8; font-weight: bold; }
</style>

<h1 style="text-align: center; color: #818cf8; margin-bottom: 30px;">معالجة البيانات بالذكاء الاصطناعي</h1>

<div class="options-group">
    <input type="radio" id="mode_product" name="processing_mode" value="product" checked>
    <label for="mode_product" class="radio-label">🛒 تفاصيل المنتج</label>
    <input type="radio" id="mode_seo" name="processing_mode" value="seo">
    <label for="mode_seo" class="radio-label">🔍 كلمات مفتاحية (SEO)</label>
    <input type="radio" id="mode_marketing" name="processing_mode" value="marketing">
    <label for="mode_marketing" class="radio-label">📱 منشور تسويقي</label>
</div>

<textarea id="userInput" placeholder="الصق النص هنا..."></textarea>
<button id="processBtn" class="btn-main" onclick="processData()">بدء المعالجة 🚀</button>
<div id="loadingIndicator">جاري المعالجة... يرجى الانتظار</div>

<div class="result-section" id="resultSection">
    <textarea id="aiResult" rows="12" readonly></textarea>
</div>

<script>
    async function processData() {
        const text = document.getElementById('userInput').value;
        const mode = document.querySelector('input[name="processing_mode"]:checked').value;
        const processBtn = document.getElementById('processBtn');
        const loading = document.getElementById('loadingIndicator');
        const resultSection = document.getElementById('resultSection');
        const aiResult = document.getElementById('aiResult');

        if (!text.trim()) return alert('يرجى إدخال البيانات.');
        
        processBtn.disabled = true; loading.style.display = 'block'; resultSection.style.display = 'none';
        try {
            const response = await fetch('/process', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text, mode: mode })
            });
            const data = await response.json();
            if (response.ok) { aiResult.value = data.result; resultSection.style.display = 'block'; } 
            else { alert('خطأ: ' + (data.error || 'غير معروف')); }
        } catch (error) { alert('فشل الاتصال.'); } 
        finally { processBtn.disabled = false; loading.style.display = 'none'; }
    }
</script>
{% endblock %}
