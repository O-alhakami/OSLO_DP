{% extends "base.html" %}
{% block content %}
<style>
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; color: #818cf8; font-weight: bold; }
    .form-group input, .form-group textarea { width: 100%; padding: 12px; background: rgba(15,23,42,0.6); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; font-family: inherit; box-sizing: border-box;}
    .msg-success { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #10b981; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: bold;}
</style>

<h1 style="color: #818cf8; text-align: center; margin-bottom: 30px;">أرشفة منتج جديد</h1>

{% with messages = get_flashed_messages(category_filter=["success"]) %}
    {% if messages %}<div class="msg-success">{{ messages[0] }}</div>{% endif %}
{% endwith %}

<form method="POST" enctype="multipart/form-data">
    <div class="form-group">
        <label>اسم المنتج</label>
        <input type="text" name="name" id="product_name" required>
    </div>
    <div class="form-group">
        <label>وصف وتفاصيل المنتج</label>
        <textarea name="description" id="product_desc" rows="8"></textarea>
    </div>
    <div class="form-group">
        <label>السعر (إضافة يدوية)</label>
        <input type="text" name="price" placeholder="مثال: 150 ريال">
    </div>
    <div class="form-group">
        <label>صورة المنتج (يتم رفعها لـ ImgBB وعرضها في البحث)</label>
        <input type="file" name="image" accept="image/*">
    </div>
    <button type="submit" class="btn btn-blue" style="width: 100%; padding: 15px; font-size: 1.1rem;">حفظ في الأرشيف وإنشاء كود 💾</button>
</form>

<!-- سكربت لاستدعاء البيانات من الذاكرة المؤقتة وتفريغها -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const savedName = sessionStorage.getItem('archive_name');
        const savedDesc = sessionStorage.getItem('archive_desc');
        
        if (savedName || savedDesc) {
            if (savedName) document.getElementById('product_name').value = savedName;
            if (savedDesc) document.getElementById('product_desc').value = savedDesc;
            
            // مسح البيانات من الذاكرة بعد تعبئتها حتى لا تتكرر عند تحديث الصفحة
            sessionStorage.removeItem('archive_name');
            sessionStorage.removeItem('archive_desc');
        }
    });
</script>
{% endblock %}
