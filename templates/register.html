<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إنشاء حساب | OSLO DP</title>
    <style>/* استخدم نفس ستايل ملف login.html تماماً هنا */
        body { font-family: 'Cairo', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e293b; padding: 40px; border-radius: 15px; width: 100%; max-width: 400px; text-align: center; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; }
        button { background: #4F46E5; color: white; padding: 12px; border: none; border-radius: 8px; width: 95%; cursor: pointer; margin-top: 15px; }
        .msg { color: #ec4899; margin-bottom: 10px; }
        a { color: #818cf8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>إنشاء حساب جديد</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}<div class="msg">{{ messages[0] }}</div>{% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="username" placeholder="اسم المستخدم" required>
            <input type="password" name="password" placeholder="كلمة المرور" required>
            <button type="submit">طلب تسجيل</button>
        </form>
        <p>لديك حساب؟ <a href="{{ url_for('login') }}">تسجيل الدخول</a></p>
    </div>
</body>
</html>
