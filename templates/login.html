<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول | OSLO DP</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e293b; padding: 40px; border-radius: 15px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 90%; padding: 15px; margin: 10px 0; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(15,23,42,0.6); color: white; font-family: inherit;}
        button { background: #4F46E5; color: white; padding: 15px; border: none; border-radius: 8px; width: 100%; cursor: pointer; margin-top: 15px; font-weight: bold; font-family: inherit; font-size: 1.1rem;}
        .msg { color: #ec4899; margin-bottom: 15px; font-weight: bold; }
        a { color: #818cf8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>OSLO DP</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}<div class="msg">{{ messages[0] }}</div>{% endif %}
        {% endwith %}
        <!-- قم بتغيير /login إلى /register في ملف register.html -->
        <form method="POST" action="/login"> 
            <input type="text" name="username" placeholder="اسم المستخدم" required>
            <input type="password" name="password" placeholder="كلمة المرور" required>
            <button type="submit">دخول</button>
        </form>
        <p>لا تملك حساب؟ <a href="/register">أنشئ حساباً</a></p>
    </div>
</body>
</html>
